name: Validate pysips correction
on:
  push:
    branches: ["validation/smcpy-likelihood-cache-20260926"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sylvesterkaczmarek/pysips
          ref: 62204e2a54540548f14b9c4e4487ade466209bf6
          fetch-depth: 0
          path: source
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: source
        run: python -m pip install -e . pytest pytest-mock coverage build flake8 pylint
      - name: Verify fixed code and reproduce original failures
        run: python harness/validation/verify.py source evidence
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-${{ matrix.python-version }}
          path: evidence/
